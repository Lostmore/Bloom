name: Bloom Stack CI

on:
  pull_request:
    paths: ['compose.yml', '.dockerignore', 'infrastructure/**', 'server/**', 'contracts/**', '.github/workflows/stack-ci.yml']
  push:
    branches: [develop, main]
    paths: ['compose.yml', '.dockerignore', 'infrastructure/**', 'server/**', 'contracts/**', '.github/workflows/stack-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python infrastructure/prepare-ci.py
      - name: Validate and start the full stack
        run: |
          docker compose -f compose.yml -f .ci/compose.yml --profile stubs config --quiet
          docker compose -f compose.yml -f .ci/compose.yml --profile stubs up -d --build --wait --wait-timeout 240
      - name: Verify service integration
        run: python infrastructure/smoke-test.py
      - name: Logs
        if: failure()
        run: docker compose -f compose.yml -f .ci/compose.yml logs --tail 100
      - name: Stop disposable stack
        if: always()
        run: docker compose -f compose.yml -f .ci/compose.yml --profile stubs down --volumes
