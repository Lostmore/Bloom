name: Identity Service CI

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'server/identity/**'
      - 'server/build.gradle'
      - 'server/settings.gradle'
      - 'server/gradle/**'
      - 'server/gradlew*'
      - '.github/workflows/identity-ci.yml'
  pull_request:
    branches: [ "develop" ]
    paths:
      - 'server/identity/**'
      - 'server/build.gradle'
      - 'server/settings.gradle'
      - 'server/gradle/**'
      - 'server/gradlew*'
      - '.github/workflows/identity-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x server/gradlew

    - name: Build and Test Identity Service
      working-directory: ./server
      run: ./gradlew :identity:build --no-daemon
