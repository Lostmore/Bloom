name: Chat Service CI

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'server/chat/**'
      - '.github/workflows/chat-ci.yml'
  pull_request:
    branches: [ "develop" ]
    paths:
      - 'server/chat/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Download dependencies
      working-directory: ./server/chat
      run: go mod download

    - name: Run Tests
      working-directory: ./server/chat
      run: go test -v ./...

    - name: Build
      working-directory: ./server/chat
      run: go build -v ./cmd/main.go
