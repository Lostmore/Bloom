name: Bloom Architecture

on:
  push:
    paths: ['server/**', 'assets/brand/**', 'compose.yml', 'docs/architecture/**', 'infrastructure/architecture/**', '.github/workflows/architecture.yml']
  pull_request:
    paths: ['server/**', 'assets/brand/**', 'compose.yml', 'docs/architecture/**', 'infrastructure/architecture/**', '.github/workflows/architecture.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python infrastructure/architecture/generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-architecture
          path: docs/architecture/
          retention-days: 14
