spring:
  application:
    name: bloom-identity

  datasource:
    url: jdbc:postgresql://localhost:5432/bloom_identity
    username: bloom_identity
    password: "" # Пароль роли bloom_identity в PostgreSQL.
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

server:
  address: 127.0.0.1
  port: 8081

bloom:
  moderation-token: "" # Отдельный секрет для блокировки/разблокировки. Пустой отключает эту операцию.
  events:
    topic: bloom.identity.v1
    scheduling-enabled: true
  internal-token: "" # Не менее 32 случайных символов; совпадает с bloom.identity.token в Users.
  jwt:
    private-key: "" # PEM PKCS#8. Для нескольких строк используй YAML-блок |.
    public-key: "" # PEM X.509 от той же пары ключей.
    access-token-ttl: 15m
    refresh-token-ttl: 30d

  security:
    argon2:
      memory: 65536
      iterations: 3
      parallelism: 1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    app.bloom.identity: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
