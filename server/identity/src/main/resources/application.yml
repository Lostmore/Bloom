spring:
  application:
    name: bloom-identity

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bloom_identity}
    username: ${DB_USER:bloom_identity}
    password: ${DB_PASSWORD:bloom_identity}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}

bloom:
  jwt:
    secret: ${JWT_SECRET:bloom-dev-secret-change-me-in-production-min-32-chars!!}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}

  security:
    argon2:
      memory: ${ARGON2_MEMORY:65536}
      iterations: ${ARGON2_ITERATIONS:3}
      parallelism: ${ARGON2_PARALLELISM:1}

logging:
  level:
    app.bloom.identity: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
