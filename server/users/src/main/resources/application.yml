server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: bloom-users
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bloom_users}
    username: ${DB_USER:bloom_users}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        size: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

bloom:
  internal-token: ${USERS_INTERNAL_API_TOKEN}
  identity:
    url: ${IDENTITY_URL:http://localhost:8081}
    token: ${IDENTITY_INTERNAL_API_TOKEN}
  media:
    url: ${MEDIA_URL:http://localhost:8093}
    token: ${MEDIA_INTERNAL_API_TOKEN}
  events:
    topic: ${USERS_EVENTS_TOPIC:bloom.users.v1}
    scheduling-enabled: ${EVENTS_SCHEDULING_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
