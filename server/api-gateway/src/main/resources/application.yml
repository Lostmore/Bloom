server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bloom-api-gateway
  web:
    resources:
      add-mappings: false
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          default-filters:
            - StripPrefix=2
            - RemoveRequestHeader=X-Internal-Token
            - RemoveRequestHeader=X-User-ID
          routes:
#           - id: example
#             uri: ${EXAMPLE_URL:http://localhost:8095}
#             predicates:
#               - Path=/api/v1/example/**
            - id: identity
              uri: ${IDENTITY_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: users
              uri: ${USERS_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/users/**,/api/v1/reports,/api/v1/interests
            - id: interactions
              uri: ${INTERACTIONS_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/interactions/**,/api/v1/matches/**
            - id: activities
              uri: ${ACTIVITIES_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/activities/**
            - id: chat-websocket
              uri: ${CHAT_WS_URL:ws://localhost:8091}
              predicates:
                - Path=/api/v1/ws
            - id: chat-rooms
              uri: ${CHAT_URL:http://localhost:8091}
              predicates:
                - Path=/api/v1/conversations
                - Method=GET,POST
              filters:
                - SetPath=/api/rooms
            - id: chat
              uri: ${CHAT_URL:http://localhost:8091}
              predicates:
                - Path=/api/v1/conversations/**
            - id: discovery
              uri: ${DISCOVERY_URL:http://localhost:8092}
              predicates:
                - Path=/api/v1/discovery/**
            - id: media
              uri: ${MEDIA_URL:http://localhost:8093}
              predicates:
                - Path=/api/v1/media/**
            - id: notifications
              uri: ${NOTIFICATIONS_URL:http://localhost:8094}
              predicates:
                - Path=/api/v1/notifications/**

bloom:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    services:
      identity:
        name: Bloom Identity
        url: ${IDENTITY_URL:http://localhost:8081}/v3/api-docs/public
        paths: ["/auth/**"]
      users:
        name: Bloom Users
        url: ${USERS_URL:http://localhost:8082}/v3/api-docs/public
        paths: ["/users/**", "/interests", "/reports"]
      interactions:
        name: Bloom Interactions
        url: ${INTERACTIONS_URL:http://localhost:8083}/v3/api-docs/public
        paths: ["/interactions/**", "/matches/**"]
      activities:
        name: Bloom Activities
        url: ${ACTIVITIES_URL:http://localhost:8084}/v3/api-docs/public
        paths: ["/activities/**"]
      chat:
        name: Bloom Chat
        url: ${CHAT_URL:http://localhost:8091}/openapi.json
        paths: ["/conversations", "/conversations/**"]
        path-mappings:
          "[/api/rooms]": /conversations
      discovery:
        name: Bloom Discovery
        url: ${DISCOVERY_URL:http://localhost:8092}/openapi.json
        paths: ["/discovery/**"]
      media:
        name: Bloom Media
        url: ${MEDIA_URL:http://localhost:8093}/openapi.json
        paths: ["/media/**"]
      notifications:
        name: Bloom Notifications
        url: ${NOTIFICATIONS_URL:http://localhost:8094}/openapi.json
        paths: ["/notifications/**"]

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
