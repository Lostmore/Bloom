<!DOCTYPE html>
<html>
<head>
    <title>Bloom Multi-Chat Test (Real Auth)</title>
    <style>
        body { font-family: sans-serif; display: flex; gap: 20px; padding: 20px; }
        .sidebar { width: 300px; border-right: 1px solid #ccc; padding-right: 20px; }
        .main { flex-grow: 1; }
        .chat-list { list-style: none; padding: 0; }
        .chat-item { padding: 10px; border: 1px solid #ddd; margin-bottom: 5px; cursor: pointer; border-radius: 5px; }
        .chat-item:hover { background: #f0f0f0; }
        #chat { height: 400px; border: 1px solid #ccc; border-radius: 5px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .message { margin-bottom: 5px; padding: 5px; background: #e1f5fe; border-radius: 4px; width: fit-content; }
        .system { color: gray; font-size: 0.9em; font-style: italic; }
        .controls { margin-bottom: 15px; }
        .auth-section { border: 1px solid #007bff; padding: 10px; border-radius: 5px; margin-bottom: 15px; background: #f0f8ff; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <!-- БЛОК АВТОРИЗАЦИИ -->
        <div class="auth-section" id="authSection">
            <h3>🔐 Авторизация</h3>
            <label>Телефон:</label>
            <input type="text" id="authPhone" value="+79991234567" style="width: 100%; margin-bottom: 5px;">
            <label>Пароль:</label>
            <input type="password" id="authPassword" value="password1234" style="width: 100%; margin-bottom: 10px;">
            <div style="display: flex; gap: 5px;">
                <button onclick="login()" style="flex-grow: 1; cursor: pointer;">Войти</button>
                <button onclick="register()" style="flex-grow: 1; cursor: pointer;">Регистрация</button>
            </div>
            <div id="authStatus" style="font-size: 0.8em; color: red; margin-top: 5px;"></div>
        </div>

        <!-- ИНФО О ТЕКУЩЕМ ПОЛЬЗОВАТЕЛЕ -->
        <div class="controls hidden" id="userInfoSection">
            <h4 style="margin: 0 0 5px 0;">✅ Вы вошли</h4>
            <div style="font-size: 0.8em; word-wrap: break-word; color: #333;">ID: <span id="myUserId"></span></div>
        </div>
        
        <!-- СОЗДАНИЕ КОМНАТЫ -->
        <div class="controls hidden" id="createRoomSection" style="border: 1px solid #eee; padding: 10px;">
            <h4>Создать новый чат</h4>
            <label>С кем (ID друга):</label>
            <input type="text" id="targetUserId" placeholder="UUID друга..." style="width: 100%;">
            <button onclick="createRoom()" style="margin-top: 5px; width: 100%; cursor: pointer;">Создать чат</button>
        </div>

        <button onclick="loadRooms()" id="loadRoomsBtn" class="hidden" style="width: 100%; padding: 10px; background: #dcedc8; border: none; cursor:pointer;">📥 Загрузить мои чаты</button>
        
        <ul id="roomsList" class="chat-list"></ul>
    </div>

    <div class="main">
        <h2 id="chatTitle">Сначала войдите в систему</h2>
        <div id="chat"></div>
        
        <div id="attachmentsPreview" style="margin-bottom: 5px; font-size: 0.9em; color: #555;"></div>
        
        <div style="display: flex; gap: 5px;">
            <input type="text" id="msg" placeholder="Напишите сообщение..." disabled style="flex-grow: 1;">
            <input type="file" id="mediaFile" multiple style="display:none;" onchange="uploadMedia()">
            <button id="uploadBtn" onclick="document.getElementById('mediaFile').click()" disabled>📎 Файлы</button>
            <button id="sendBtn" onclick="sendMessage()" disabled>Отправить</button>
        </div>
    </div>

    <script>
        const host = window.location.host;
        const protocol = window.location.protocol;
        const wsProtocol = protocol === "https:" ? "wss:" : "ws:";
        
        const authApiUrl = `${protocol}//${host}/api/v1/auth`;
        const roomsApiUrl = `${protocol}//${host}/api/v1/conversations`; // Через Gateway API это будет проксировано на Чат
        const mediaApiUrl = `${protocol}//${host}/api/v1/media/upload`;
        
        let ws;
        let currentRoomId = null;
        let accessToken = null;
        let currentUserId = null;
        let uploadedFiles = []; // Массив ссылок

        // ----- АВТОРИЗАЦИЯ -----
        async function register() {
            const phone = document.getElementById("authPhone").value;
            const password = document.getElementById("authPassword").value;
            try {
                const res = await fetch(`${authApiUrl}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phone, password: password })
                });
                if (res.ok) {
                    const data = await res.json();
                    onAuthSuccess(data);
                } else {
                    document.getElementById("authStatus").innerText = "Ошибка регистрации: " + await res.text();
                }
            } catch(e) { document.getElementById("authStatus").innerText = e; }
        }

        async function login() {
            const phone = document.getElementById("authPhone").value;
            const password = document.getElementById("authPassword").value;
            try {
                const res = await fetch(`${authApiUrl}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phone, password: password })
                });
                if (res.ok) {
                    const data = await res.json();
                    onAuthSuccess(data);
                } else {
                    document.getElementById("authStatus").innerText = "Ошибка входа: " + await res.text();
                }
            } catch(e) { document.getElementById("authStatus").innerText = e; }
        }

        async function onAuthSuccess(data) {
            accessToken = data.accessToken;
            
            // Запрашиваем свой профиль чтобы узнать свой accountId
            const meRes = await fetch(`${authApiUrl}/me`, {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            if (meRes.ok) {
                const meData = await meRes.json();
                currentUserId = meData.accountId;
                document.getElementById("myUserId").innerText = currentUserId;
                
                // Переключаем интерфейс
                document.getElementById("authSection").classList.add("hidden");
                document.getElementById("userInfoSection").classList.remove("hidden");
                document.getElementById("createRoomSection").classList.remove("hidden");
                document.getElementById("loadRoomsBtn").classList.remove("hidden");
                document.getElementById("chatTitle").innerText = "Выберите чат";
                
                loadRooms();
            }
        }


        // ----- ЧАТЫ И КОМНАТЫ -----
        async function createRoom() {
            const targetId = document.getElementById("targetUserId").value;
            try {
                const res = await fetch(roomsApiUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + accessToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user2_id: targetId })
                });
                if (res.ok) {
                    alert("Комната создана!");
                    loadRooms();
                } else {
                    alert("Ошибка: " + await res.text());
                }
            } catch (e) {
                alert("Ошибка: " + e);
            }
        }

        async function loadRooms() {
            try {
                const res = await fetch(roomsApiUrl, {
                    headers: {
                        'Authorization': 'Bearer ' + accessToken
                    }
                });
                if (res.ok) {
                    const rooms = await res.json();
                    const list = document.getElementById("roomsList");
                    list.replaceChildren();
                    if (!rooms || rooms.length === 0) {
                        const empty = document.createElement("li");
                        empty.textContent = "Нет чатов";
                        list.appendChild(empty);
                        return;
                    }
                    rooms.forEach(room => {
                        const li = document.createElement("li");
                        li.className = "chat-item";
                        const otherUserId = room.user1_id == currentUserId ? room.user2_id : room.user1_id;
                        li.innerText = `Чат с User (ID: ${otherUserId.substring(0,8)}...)`;
                        li.onclick = () => connectToRoom(room.id, otherUserId);
                        list.appendChild(li);
                    });
                } else {
                    alert("Ошибка загрузки комнат: " + await res.text());
                }
            } catch (e) {
                alert("Ошибка загрузки комнат: " + e);
            }
        }

        // ----- WEBSOCKET -----
        async function connectToRoom(roomId, otherUserId) {
            if (ws) { ws.close(); } 
            
            document.getElementById("chatTitle").innerText = `Чат с User (ID: ${otherUserId.substring(0,8)}...)`;
            document.getElementById("chat").replaceChildren();
            
            try {
                // Подключаемся к вебсокету, передавая реальный токен!
                const wsUrl = `${wsProtocol}//${host}/api/v1/ws?token=${accessToken}&room_id=${roomId}`;
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    printMsg("Система", "Подключено к комнате", "system");
                    document.getElementById("msg").disabled = false;
                    document.getElementById("sendBtn").disabled = false;
                    document.getElementById("uploadBtn").disabled = false;
                    currentRoomId = roomId;
                };
                
                ws.onmessage = (evt) => {
                    const data = JSON.parse(evt.data);
                    
                    const sender = data.sender_id == currentUserId ? "Вы" : "Собеседник";
                    
                    // Собираем ссылки из attachments, если они есть
                    let urls = [];
                    if (data.attachments && data.attachments.length > 0) {
                        urls = data.attachments.map(att => att.url);
                    }
                    printMsg(sender, data.content, "", urls);
                };
                
                ws.onclose = () => {
                    printMsg("Система", "Отключено", "system");
                    document.getElementById("msg").disabled = true;
                    document.getElementById("sendBtn").disabled = true;
                    document.getElementById("uploadBtn").disabled = true;
                };
                
            } catch (e) {
                alert("Ошибка подключения к сокету: " + e);
            }
        }

        // ----- МЕДИА -----
        async function uploadMedia() {
            const files = document.getElementById("mediaFile").files;
            if (files.length === 0) return;
            
            for (let i = 0; i < files.length; i++) {
                const formData = new FormData();
                formData.append("file", files[i]);
                
                document.getElementById("attachmentsPreview").innerText = `Загрузка файла ${i+1} из ${files.length}...`;

                try {
                    const res = await fetch(mediaApiUrl, {
                        method: "POST",
                        headers: {
                            'Authorization': 'Bearer ' + accessToken
                        },
                        body: formData
                    });
                    
                    if (res.ok) {
                        const data = await res.json();
                        uploadedFiles.push(data.url);
                    } else {
                        alert("Ошибка загрузки файла " + files[i].name + ": " + await res.text());
                    }
                } catch (e) {
                    alert("Ошибка при отправке файла: " + e);
                }
            }

            document.getElementById("mediaFile").value = "";
            renderAttachmentsPreview();
        }

        function renderAttachmentsPreview() {
            const previewDiv = document.getElementById("attachmentsPreview");
            if (uploadedFiles.length === 0) {
                previewDiv.innerText = "";
                return;
            }
            previewDiv.textContent = `Прикреплено файлов: ${uploadedFiles.length}. `;
            const clear = document.createElement("button");
            clear.textContent = "Удалить всё";
            clear.onclick = clearAttachments;
            previewDiv.appendChild(clear);
        }

        function clearAttachments() {
            uploadedFiles = [];
            renderAttachmentsPreview();
        }

        // ----- СООБЩЕНИЯ -----
        function sendMessage() {
            const input = document.getElementById("msg");
            if (input.value.trim() === "" && uploadedFiles.length === 0) return;
            
            const msgObj = {
                content: input.value,
                attachments: uploadedFiles.map(url => ({ url: url })) 
            };
            
            ws.send(JSON.stringify(msgObj));
            input.value = "";
            clearAttachments(); 
        }

        function safeMediaUrl(value) {
            if (typeof value !== "string") return null;
            try {
                const url = new URL(value, window.location.origin);
                if (url.origin !== window.location.origin || !["http:", "https:"].includes(url.protocol)
                    || url.username || url.password || url.search || url.hash
                    || !/^\/api\/v1\/media\/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(url.pathname)) return null;
                return url.href;
            } catch (_) { return null; }
        }

        async function downloadMedia(url, button) {
            // Never navigate to unverified Media content: HTML/SVG may contain scripts.
            const safeUrl = safeMediaUrl(url);
            if (!safeUrl) return;
            button.disabled = true;
            try {
                const response = await fetch(safeUrl, {
                    headers: { Authorization: "Bearer " + accessToken },
                    redirect: "error",
                    credentials: "omit",
                    signal: AbortSignal.timeout(30000)
                });
                if (!response.ok) throw new Error("Не удалось скачать файл");
                const reader = response.body.getReader();
                const chunks = [];
                let size = 0;
                try {
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        size += value.byteLength;
                        if (size > 10 * 1024 * 1024) throw new Error("Файл слишком большой");
                        chunks.push(value);
                    }
                } finally { await reader.cancel(); }
                const blob = new Blob(chunks, { type: "application/octet-stream" });
                const blobUrl = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = blobUrl;
                link.download = "bloom-attachment.bin";
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
            } catch (_) {
                alert("Не удалось скачать файл. Проверь доступ и подключение.");
            } finally { button.disabled = false; }
        }

        function printMsg(sender, text, className, attachments) {
            const chatDiv = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = className === "system" ? "message system" : "message";
            const author = document.createElement("b");
            author.textContent = `${sender}: `;
            div.appendChild(author);
            div.appendChild(document.createTextNode(typeof text === "string" ? text : ""));
            
            if (Array.isArray(attachments) && attachments.length > 0) {
                const list = document.createElement("ul");
                attachments.forEach(value => {
                    const item = document.createElement("li");
                    const url = safeMediaUrl(value);
                    if (url) {
                        const button = document.createElement("button");
                        button.textContent = "Скачать файл (без предпросмотра)";
                        button.onclick = () => downloadMedia(url, button);
                        item.appendChild(button);
                    } else {
                        item.textContent = "Недопустимая ссылка на вложение";
                    }
                    list.appendChild(item);
                });
                div.appendChild(list);
            }
            chatDiv.appendChild(div);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }
    </script>
</body>
</html>
