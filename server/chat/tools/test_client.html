<!DOCTYPE html>
<html>

<head>
    <title>Bloom Multi-Chat Test (Real Auth)</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .sidebar {
            width: 300px;
            border-right: 1px solid #ccc;
            padding-right: 20px;
        }

        .main {
            flex-grow: 1;
        }

        .chat-list {
            list-style: none;
            padding: 0;
        }

        .chat-item {
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 5px;
            cursor: pointer;
            border-radius: 5px;
        }

        .chat-item:hover {
            background: #f0f0f0;
        }

        #chat {
            height: 400px;
            border: 1px solid #ccc;
            border-radius: 5px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            background: #f9f9f9;
        }

        .message {
            margin-bottom: 5px;
            padding: 5px;
            background: #e1f5fe;
            border-radius: 4px;
            width: fit-content;
        }

        .system {
            color: gray;
            font-size: 0.9em;
            font-style: italic;
        }

        .controls {
            margin-bottom: 15px;
        }

        .auth-section {
            border: 1px solid #007bff;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            background: #f0f8ff;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <!-- БЛОК АВТОРИЗАЦИИ -->
        <div class="auth-section" id="authSection">
            <h3>🔐 Авторизация</h3>
            <label>Телефон:</label>
            <input type="text" id="authPhone" value="+79991234567" style="width: 100%; margin-bottom: 5px;">
            <label>Пароль:</label>
            <input type="password" id="authPassword" value="password1234" style="width: 100%; margin-bottom: 10px;">
            <div style="display: flex; gap: 5px;">
                <button onclick="login()" style="flex-grow: 1; cursor: pointer;">Войти</button>
                <button onclick="register()" style="flex-grow: 1; cursor: pointer;">Регистрация</button>
            </div>
            <div id="authStatus" style="font-size: 0.8em; color: red; margin-top: 5px;"></div>
        </div>

        <!-- ИНФО О ТЕКУЩЕМ ПОЛЬЗОВАТЕЛЕ -->
        <div class="controls hidden" id="userInfoSection">
            <h4 style="margin: 0 0 5px 0;">✅ Вы вошли</h4>
            <div style="font-size: 0.8em; word-wrap: break-word; color: #333;">ID: <span id="myUserId"></span></div>
        </div>

        <!-- СОЗДАНИЕ КОМНАТЫ -->
        <div class="controls hidden" id="createRoomSection" style="border: 1px solid #eee; padding: 10px;">
            <h4>Создать новый чат</h4>
            <label>С кем (ID друга):</label>
            <input type="text" id="targetUserId" placeholder="UUID друга..." style="width: 100%;">
            <button onclick="createRoom()" style="margin-top: 5px; width: 100%; cursor: pointer;">Создать чат</button>
        </div>

        <button onclick="loadRooms()" id="loadRoomsBtn" class="hidden"
            style="width: 100%; padding: 10px; background: #dcedc8; border: none; cursor:pointer;">📥 Загрузить мои
            чаты</button>

        <!-- ПОИСК СООБЩЕНИЙ -->
        <div class="controls hidden" id="searchSection"
            style="border: 1px solid #eee; padding: 10px; margin-top: 10px;">
            <h4>Поиск сообщений</h4>
            <input type="text" id="searchQuery" placeholder="Что ищем?" style="width: 100%; margin-bottom: 5px;">
            <button onclick="searchMessages()" style="width: 100%; cursor: pointer;">Найти</button>
            <ul id="searchResults" class="chat-list" style="margin-top: 10px; max-height: 200px; overflow-y: auto;">
            </ul>
        </div>

        <ul id="roomsList" class="chat-list"></ul>
    </div>

    <div class="main">
        <h2 id="chatTitle" style="margin-bottom: 5px;">Сначала войдите в систему</h2>
        <div id="onlineStatus" style="font-size: 0.85em; color: gray; margin-bottom: 10px; min-height: 15px;"></div>
        <div id="chat"></div>

        <div id="attachmentsPreview" style="margin-bottom: 5px; font-size: 0.9em; color: #555;"></div>

        <div style="display: flex; gap: 5px;">
            <input type="text" id="msg" placeholder="Напишите сообщение..." disabled style="flex-grow: 1;"
                oninput="sendTyping()">
            <input type="file" id="mediaFile" multiple style="display:none;" onchange="uploadMedia()">
            <button id="uploadBtn" onclick="document.getElementById('mediaFile').click()" disabled>📎 Файлы</button>
            <button id="sendBtn" onclick="sendMessage()" disabled>Отправить</button>
        </div>
        <div id="typingIndicator" style="font-size: 0.8em; color: gray; margin-top: 5px; min-height: 15px;"></div>
    </div>

    <script>
        const host = window.location.host;
        const protocol = window.location.protocol;
        const wsProtocol = protocol === "https:" ? "wss:" : "ws:";

        const authApiUrl = `${protocol}//${host}/api/v1/auth`;
        const roomsApiUrl = `${protocol}//${host}/api/v1/conversations`; // Через Gateway API это будет проксировано на Чат
        const mediaApiUrl = `${protocol}//${host}/api/v1/media/upload`;

        let ws;
        let currentRoomId = null;
        let currentOtherUserId = null;
        let accessToken = null;
        let currentUserId = null;
        let uploadedFiles = []; // Array of objects { media_id, media_type }
        let attachmentsSupported = false;

        // Кэш онлайн-статусов
        let userPresence = {};

        function updateOnlineStatus(status) {
            const el = document.getElementById("onlineStatus");
            if (!status) {
                el.innerText = "";
                return;
            }
            if (status === "online") {
                el.innerText = "● В сети";
                el.style.color = "green";
            } else {
                el.innerText = "○ Не в сети";
                el.style.color = "gray";
            }
        }

        // ----- АВТОРИЗАЦИЯ -----
        async function register() {
            const phone = document.getElementById("authPhone").value;
            const password = document.getElementById("authPassword").value;
            try {
                const res = await fetch(`${authApiUrl}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                if (res.ok) {
                    document.getElementById("authStatus").innerText = "Регистрация успешна! Теперь войдите.";
                    document.getElementById("authStatus").style.color = "green";
                } else {
                    document.getElementById("authStatus").innerText = "Ошибка: " + await res.text();
                }
            } catch (e) {
                document.getElementById("authStatus").innerText = "Ошибка: " + e;
            }
        }

        async function login() {
            const phone = document.getElementById("authPhone").value;
            const password = document.getElementById("authPassword").value;
            try {
                const res = await fetch(`${authApiUrl}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    accessToken = data.access_token || data.token;
                    if (!accessToken) {
                        document.getElementById("authStatus").innerText = "Токен не получен";
                        return;
                    }
                    onAuthSuccess(accessToken);
                } else {
                    document.getElementById("authStatus").innerText = "Ошибка: " + await res.text();
                }
            } catch (e) {
                document.getElementById("authStatus").innerText = "Ошибка: " + e;
            }
        }

        async function onAuthSuccess(token) {
            // Декодируем JWT чтобы получить user_id
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                currentUserId = payload.user_id || payload.sub;
            } catch (e) {
                currentUserId = "unknown";
            }

            document.getElementById("authSection").classList.add("hidden");
            document.getElementById("userInfoSection").classList.remove("hidden");
            document.getElementById("createRoomSection").classList.remove("hidden");
            document.getElementById("loadRoomsBtn").classList.remove("hidden");
            document.getElementById("searchSection").classList.remove("hidden");
            document.getElementById("myUserId").innerText = currentUserId;

            // --- CAPABILITIES CHECK ---
            try {
                const chatCapRes = await fetch(`${protocol}//${host}/api/v1/conversations/capabilities`, {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                const mediaCapRes = await fetch(`${protocol}//${host}/api/v1/media/capabilities`, {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                if (chatCapRes.ok && mediaCapRes.ok) {
                    const chatCap = await chatCapRes.json();
                    const mediaCap = await mediaCapRes.json();
                    if (chatCap.attachmentMessages && mediaCap.privateChatAttachments) {
                        attachmentsSupported = true;
                    }
                }
            } catch (e) { console.warn("Capabilities check failed:", e); }

            // --- ГЛОБАЛЬНЫЙ ВЕБСОКЕТ ---
            const wsUrl = `${wsProtocol}//${host}/api/v1/ws?token=${accessToken}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log("WS Подключен");
            };

            ws.onmessage = (evt) => {
                const wsMsg = JSON.parse(evt.data);

                if (wsMsg.type === "error") {
                    alert("Ошибка сервера: " + wsMsg.error);
                    return;
                }

                if (wsMsg.type === "new_message") {
                    const data = wsMsg.payload;

                    if (wsMsg.type === "error") {
                        alert("Ошибка сервера: " + wsMsg.error);
                        return;
                    }

                    if (wsMsg.type === "new_message") {
                        const data = wsMsg.payload;

                    // Рисуем сообщение только если мы сейчас сидим в этой комнате
                    if (data.room_id === currentRoomId) {
                        printMsg(data, "");

                        // Сбрасываем индикатор "печатает"
                        document.getElementById("typingIndicator").innerText = "";

                        // Автоматически помечаем как прочитанное, если мы получатель
                        if (data.sender_id !== currentUserId) {
                            ws.send(JSON.stringify({
                                type: "mark_as_read",
                                payload: { message_id: data.id, room_id: currentRoomId }
                            }));
                        }
                    } else {
                        console.log("Новое сообщение в другой комнате:", data.room_id);
                    }
                } else if (wsMsg.type === "edit_message" || wsMsg.type === "delete_message" || wsMsg.type === "mark_as_read") {
                    if (wsMsg.payload.room_id === currentRoomId) {
                        // Простой хак для тестового клиента: просто перезагружаем історію чата,
                        // чтобы отобразить все новые статусы (прочитано/изменено/удалено).
                        connectToRoom(currentRoomId, currentOtherUserId);
                    }
                }

                if (wsMsg.type === "typing") {
                    const data = wsMsg.payload;
                    if (data.room_id === currentRoomId && data.user_id !== currentUserId) {
                        const ind = document.getElementById("typingIndicator");
                        if (data.is_typing) {
                            ind.innerText = "Собеседник печатает...";
                            clearTimeout(window.typingTimeout);
                            window.typingTimeout = setTimeout(() => { ind.innerText = ""; }, 3000);
                        } else {
                            ind.innerText = "";
                        }
                    }
                }

                if (wsMsg.type === "presence") {
                    const data = wsMsg.payload;
                    // 1. Обязательно кэшируем статус в память браузера!
                    userPresence[data.user_id] = data.status;

                    // 2. Если сейчас открыт чат с этим собеседником — обновляем UI
                    if (data.user_id === currentOtherUserId) {
                        updateOnlineStatus(data.status);
                    }
                }
            };

            ws.onclose = () => {
                console.log("WS Отключен");
                document.getElementById("msg").disabled = true;
                document.getElementById("sendBtn").disabled = true;
                document.getElementById("uploadBtn").disabled = true;
            };

            loadRooms();
        }


        // ----- ЧАТЫ И КОМНАТЫ -----
        async function createRoom() {
            const targetId = document.getElementById("targetUserId").value;
            try {
                const res = await fetch(roomsApiUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + accessToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user2_id: targetId })
                });
                if (res.ok) {
                    alert("Комната создана!");
                    loadRooms();
                } else {
                    alert("Ошибка: " + await res.text());
                }
            } catch (e) {
                alert("Ошибка: " + e);
            }
        }

        async function loadRooms() {
            try {
                const res = await fetch(roomsApiUrl, {
                    headers: {
                        'Authorization': 'Bearer ' + accessToken
                    }
                });
                if (res.ok) {
                    const rooms = await res.json();
                    const list = document.getElementById("roomsList");
                    list.replaceChildren();
                    if (!rooms || rooms.length === 0) {
                        const empty = document.createElement("li");
                        empty.textContent = "Нет чатов";
                        list.appendChild(empty);
                        return;
                    }
                    rooms.forEach(room => {
                        const li = document.createElement("li");
                        li.className = "chat-item";
                        const otherUserId = room.user1_id == currentUserId ? room.user2_id : room.user1_id;

                        let text = `Чат с User (ID: ${otherUserId.substring(0, 8)}...)`;
                        if (room.last_message) {
                            text += `\n💬 ${room.last_message}`;
                        }
                        li.innerText = text;

                        li.onclick = () => connectToRoom(room.id, otherUserId);
                        list.appendChild(li);
                    });
                } else {
                    alert("Ошибка загрузки комнат: " + await res.text());
                }
            } catch (e) {
                alert("Ошибка загрузки комнат: " + e);
            }
        }

        // ----- ПОИСК -----
        async function searchMessages() {
            const query = document.getElementById("searchQuery").value;
            if (!query.trim()) return;

            try {
                const searchUrl = `${protocol}//${host}/api/v1/conversations/search?q=${encodeURIComponent(query.trim())}`;
                const res = await fetch(searchUrl, {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });

                const list = document.getElementById("searchResults");
                list.replaceChildren();

                if (res.ok) {
                    const data = await res.json();
                    if (!data.items || data.items.length === 0) {
                        const empty = document.createElement("li");
                        empty.textContent = "Ничего не найдено";
                        list.appendChild(empty);
                        return;
                    }
                    data.items.forEach(item => {
                        const li = document.createElement("li");
                        li.className = "chat-item";
                        li.style.fontSize = "0.85em";
                        li.innerText = `Комната ${item.room_id}\nСообщение: ${item.content}`;
                        li.onclick = () => {
                            loadContext(item.room_id, item.id);
                        };
                        list.appendChild(li);
                    });
                } else {
                    alert("Ошибка поиска: " + await res.text());
                }
            } catch (e) {
                alert("Ошибка поиска: " + e);
            }
        }

        async function loadContext(roomId, aroundId) {
            currentRoomId = roomId;
            currentOtherUserId = null; // We don't necessarily know it
            document.getElementById("chatTitle").innerText = `Контекст сообщения ${aroundId} (Комната ${roomId})`;
            document.getElementById("chat").replaceChildren();

            try {
                const contextUrl = `${protocol}//${host}/api/v1/conversations/${roomId}/messages?around=${aroundId}&limit=50`;
                const res = await fetch(contextUrl, {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                if (res.ok) {
                    const page = await res.json();
                    const msgs = page.items || page;
                    if (msgs && msgs.length > 0) {
                        msgs.forEach(data => {
                            printMsg(data, "");
                            if (data.id === aroundId) {
                                const msgDiv = document.getElementById("msg-" + data.id);
                                if (msgDiv) msgDiv.style.border = "2px solid orange";
                            }
                        });
                    } else {
                        printMsg({ sender_id: "system", content: "Сообщений не найдено." }, "system");
                    }
                } else {
                    alert("Ошибка загрузки контекста: " + await res.text());
                }
            } catch (e) {
                console.error("Ошибка загрузки контекста", e);
            }

            document.getElementById("msg").disabled = false;
            document.getElementById("sendBtn").disabled = false;
            if (attachmentsSupported) {
                document.getElementById("uploadBtn").disabled = false;
            } else {
                document.getElementById("uploadBtn").disabled = true;
            }
        }

        // ----- WEBSOCKET -----
        async function connectToRoom(roomId, otherUserId) {
            currentRoomId = roomId;
            currentOtherUserId = otherUserId;
            document.getElementById("chatTitle").innerText = `Чат с User (ID: ${otherUserId.substring(0, 8)}...)`;

            // Подтягиваем актуальный статус из памяти
            updateOnlineStatus(userPresence[otherUserId]);

            document.getElementById("chat").replaceChildren();

            // Загрузка истории сообщений (теперь через REST)
            try {
                // Если ты используешь Gateway, убедись, что этот маршрут проксируется правильно
                const historyUrl = `${protocol}//${host}/api/v1/conversations/${roomId}/messages`;
                const res = await fetch(historyUrl, {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                });
                if (res.ok) {
                    const msgs = await res.json();
                    if (msgs && msgs.length > 0) {
                        msgs.forEach(data => {
                            printMsg(data, "");

                            // Если мы зашли и видим непрочитанные сообщения собеседника — помечаем их
                            if (data.sender_id !== currentUserId && !data.read_at) {
                                ws.send(JSON.stringify({
                                    type: "mark_as_read",
                                    payload: { message_id: data.id, room_id: currentRoomId }
                                }));
                            }
                        });
                    } else {
                        printMsg({ sender_id: "system", content: "Сообщений пока нет. Напишите первым!" }, "system");
                    }
                } else {
                    console.error("Ошибка HTTP:", res.status);
                }
            } catch (e) {
                console.error("Ошибка загрузки истории", e);
            }

            document.getElementById("msg").disabled = false;
            document.getElementById("sendBtn").disabled = false;
            if (attachmentsSupported) {
                document.getElementById("uploadBtn").disabled = false;
            } else {
                document.getElementById("uploadBtn").disabled = true;
            }
        }

        // ----- МЕДИА -----
        async function uploadMedia() {
            const files = document.getElementById("mediaFile").files;
            if (files.length === 0) return;
            if (!currentRoomId) {
                alert("Сначала выберите чат");
                return;
            }

            for (let i = 0; i < files.length; i++) {
                const formData = new FormData();
                formData.append("file", files[i]);
                formData.append("roomId", currentRoomId);

                document.getElementById("attachmentsPreview").innerText = `Загрузка файла ${i + 1} из ${files.length}...`;

                try {
                    const res = await fetch(`${protocol}//${host}/api/v1/media/chat-attachments`, {
                        method: "POST",
                        headers: {
                            'Authorization': 'Bearer ' + accessToken,
                            'Idempotency-Key': crypto.randomUUID()
                        },
                        body: formData
                    });

                    if (res.ok) {
                        const data = await res.json();
                        // Сохраняем uuid, как ожидает сервер в новом формате
                        uploadedFiles.push({
                            media_id: data.mediaId
                        });
                    } else {
                        alert("Ошибка загрузки файла " + files[i].name + ": " + await res.text());
                    }
                } catch (e) {
                    alert("Ошибка при отправке файла: " + e);
                }
            }

            document.getElementById("mediaFile").value = "";
            renderAttachmentsPreview();
        }

        function renderAttachmentsPreview() {
            const previewDiv = document.getElementById("attachmentsPreview");
            if (uploadedFiles.length === 0) {
                previewDiv.innerText = "";
                return;
            }
            previewDiv.textContent = `Прикреплено файлов: ${uploadedFiles.length}. `;
            const clear = document.createElement("button");
            clear.textContent = "Удалить всё";
            clear.onclick = clearAttachments;
            previewDiv.appendChild(clear);
        }

        function clearAttachments() {
            uploadedFiles = [];
            renderAttachmentsPreview();
        }

        let lastTypingTime = 0;
        function sendTyping() {
            if (!ws || ws.readyState !== WebSocket.OPEN || !currentRoomId) return;
            const now = Date.now();
            if (now - lastTypingTime < 2000) return; // шлём не чаще раз в 2 секунды
            lastTypingTime = now;

            ws.send(JSON.stringify({
                type: "typing",
                payload: { room_id: currentRoomId, is_typing: true }
            }));
        }

        // ----- СООБЩЕНИЯ -----
        function sendMessage() {
            const input = document.getElementById("msg");
            if (input.value.trim() === "" && uploadedFiles.length === 0) return;

            const msgObj = {
                type: "new_message",
                payload: {
                    room_id: currentRoomId,
                    client_message_id: crypto.randomUUID(),
                    content: input.value,
                    attachments: uploadedFiles
                }
            };

            ws.send(JSON.stringify(msgObj));
            input.value = "";
            clearAttachments();
        }

        function safeMediaUrl(value) {
            if (typeof value !== "string") return null;
            try {
                const url = new URL(value, window.location.origin);
                if (url.origin !== window.location.origin || !["http:", "https:"].includes(url.protocol)
                    || url.username || url.password || url.search || url.hash
                    || !/^\/api\/v1\/media\/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(url.pathname)) return null;
                return url.href;
            } catch (_) { return null; }
        }

        async function downloadMedia(url, button) {
            // Never navigate to unverified Media content: HTML/SVG may contain scripts.
            const safeUrl = safeMediaUrl(url);
            if (!safeUrl) return;
            button.disabled = true;
            try {
                const response = await fetch(safeUrl, {
                    headers: { Authorization: "Bearer " + accessToken },
                    redirect: "error",
                    credentials: "omit",
                    signal: AbortSignal.timeout(30000)
                });
                if (!response.ok) throw new Error("Не удалось скачать файл");
                const reader = response.body.getReader();
                const chunks = [];
                let size = 0;
                try {
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        size += value.byteLength;
                        if (size > 10 * 1024 * 1024) throw new Error("Файл слишком большой");
                        chunks.push(value);
                    }
                } finally { await reader.cancel(); }
                const blob = new Blob(chunks, { type: "application/octet-stream" });
                const blobUrl = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = blobUrl;
                link.download = "bloom-attachment.bin";
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
            } catch (_) {
                alert("Не удалось скачать файл. Проверь доступ и подключение.");
            } finally { button.disabled = false; }
        }

        function printMsg(data, className) {
            const chatDiv = document.getElementById("chat");
            const div = document.createElement("div");
            if (data.id) div.id = "msg-" + data.id;
            div.className = className === "system" ? "message system" : "message";

            const isMe = data.sender_id === currentUserId;
            const sender = className === "system" ? "Система" : (isMe ? "Вы" : "Собеседник");

            const author = document.createElement("b");
            author.textContent = `${sender}: `;
            div.appendChild(author);

            if (data.deleted_at) {
                div.appendChild(document.createTextNode("[Сообщение удалено]"));
                chatDiv.appendChild(div);
                chatDiv.scrollTop = chatDiv.scrollHeight;
                return;
            }

            const textNode = document.createTextNode((typeof data.content === "string" ? data.content : "") + " ");
            div.appendChild(textNode);

            if (data.edited_at) {
                const editedSpan = document.createElement("small");
                editedSpan.style.color = "gray";
                editedSpan.textContent = "[Изменено] ";
                div.appendChild(editedSpan);
            }

            if (isMe && data.read_at) {
                const readSpan = document.createElement("small");
                readSpan.style.color = "green";
                readSpan.textContent = "✓✓ ";
                div.appendChild(readSpan);
            }

            if (Array.isArray(data.attachments) && data.attachments.length > 0) {
                const list = document.createElement("ul");
                data.attachments.forEach(att => {
                    const item = document.createElement("li");
                    if (att.media_id) {
                        item.textContent = `Медиа файл: ${att.media_id}`;
                    } else {
                        const url = safeMediaUrl(att.url);
                        if (url) {
                            const button = document.createElement("button");
                            button.textContent = "Скачать файл (без предпросмотра)";
                            button.onclick = () => downloadMedia(url, button);
                            item.appendChild(button);
                        } else {
                            item.textContent = "Недопустимая ссылка на вложение";
                        }
                    }
                    list.appendChild(item);
                });
                div.appendChild(list);
            }

            if (isMe && !className) {
                const editBtn = document.createElement("button");
                editBtn.textContent = "✎";
                editBtn.style.marginLeft = "10px";
                editBtn.onclick = () => {
                    const newText = prompt("Редактировать сообщение:", data.content);
                    if (newText !== null && newText.trim() !== "") {
                        ws.send(JSON.stringify({ type: "edit_message", payload: { message_id: data.id, room_id: currentRoomId, content: newText } }));
                    }
                };
                const delBtn = document.createElement("button");
                delBtn.textContent = "🗑";
                delBtn.onclick = () => {
                    if (confirm("Удалить сообщение?")) {
                        ws.send(JSON.stringify({ type: "delete_message", payload: { message_id: data.id, room_id: currentRoomId } }));
                    }
                };
                div.appendChild(editBtn);
                div.appendChild(delBtn);
            }

            chatDiv.appendChild(div);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }
    </script>
</body>

</html>
