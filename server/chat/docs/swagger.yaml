components:
  schemas:
    domain.Room:
      properties:
        created_at:
          type: string
        id:
          type: integer
        is_active:
          type: boolean
        user1_id:
          format: uuid
          type: string
        user2_id:
          format: uuid
          type: string
      type: object
    http.CreateRoomRequest:
      properties:
        user2_id:
          format: uuid
          type: string
      required:
      - user2_id
      type: object
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
externalDocs:
  description: ""
  url: ""
info:
  description: Микросервис для работы с чатами в Bloom
  title: Bloom Chat API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/rooms:
    get:
      description: Возвращает список комнат, в которых состоит текущий пользователь
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/domain.Room'
                type: array
          description: Список комнат
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Authorization token invalid
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Failed to get user rooms
      security:
      - BearerAuth: []
      summary: Получить список комнат
      tags:
      - rooms
    post:
      description: Создает новую комнату чата с выбранным пользователем
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/http.CreateRoomRequest'
              description: Данные для создания комнаты
              summary: request
        description: Данные для создания комнаты
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.Room'
          description: Созданная комната
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Invalid request body
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Authorization token invalid
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Failed to create room
      security:
      - BearerAuth: []
      summary: Создать комнату
      tags:
      - rooms
