version: '3.8'
services:
  media-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: media-db
    ports:
      - "5434:5432"
  media-app:
    build: .
    ports:
      - "8093:8093"
    environment:
      - DATABASE_URL=postgres://testuser:testpass@media-db:5432/media-db?sslmode=disable
    depends_on:
      - media-db
