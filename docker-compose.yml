version: '3.8'

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bloom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bloom_secret}
      POSTGRES_DB: bloom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c effective_cache_size=256MB
        -c max_connections=100
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bloom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:latest
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_HEAP_OPTS=-Xmx256m -Xms128m
    volumes:
      - kafka_data:/bitnami/kafka
    deploy:
      resources:
        limits:
          memory: 512m

  discovery:
    build:
      context: .
      dockerfile: infrastructure/java/Dockerfile
      args:
        SERVICE: discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    deploy:
      resources:
        limits:
          memory: 384m

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/java/Dockerfile
      args:
        SERVICE: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - IDENTITY_INTERNAL_TOKEN=${IDENTITY_INTERNAL_TOKEN:-}
    depends_on:
      discovery:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384m

  identity:
    build:
      context: .
      dockerfile: infrastructure/java/Dockerfile
      args:
        SERVICE: identity
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bloom
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-bloom}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-bloom_secret}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384m

  users:
    build:
      context: ./server
      dockerfile: ../server/users/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bloom
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-bloom}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-bloom_secret}
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384m

  interactions:
    build:
      context: .
      dockerfile: infrastructure/java/Dockerfile
      args:
        SERVICE: interactions
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bloom
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-bloom}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-bloom_secret}
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384m

  activities:
    build:
      context: .
      dockerfile: infrastructure/java/Dockerfile
      args:
        SERVICE: activities
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bloom
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-bloom}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-bloom_secret}
    depends_on:
      postgres:
        condition: service_healthy
      discovery:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 300m

  chat:
    build: ./server/chat
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-bloom}:${DB_PASSWORD:-bloom_secret}@postgres:5432/bloom?sslmode=disable
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 64m

  media:
    build: ./server/media
    restart: unless-stopped
    ports:
      - "8093:8093"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-bloom}:${DB_PASSWORD:-bloom_secret}@postgres:5432/bloom?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  postgres_data:
  redis_data:
  kafka_data:
