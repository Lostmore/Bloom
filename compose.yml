name: bloom

x-java: &java
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  mem_limit: 768m
  networks:
    - backend

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "" # Пароль администратора БД; приложения его не используют.
      IDENTITY_DATABASE_PASSWORD: "" # Совпадает с паролем в Identity application.yml.
      USERS_DATABASE_PASSWORD: "" # Совпадает с паролем в Users application.yml.
      CHAT_DATABASE_PASSWORD: "" # Совпадает с паролем в DATABASE_URL сервиса chat ниже.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-bloom.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in bloom.users.v1 bloom.identity.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 \
            --replication-factor 1 --config retention.ms=604800000
        done
    restart: 'no'
    networks: [backend]

  identity:
    <<: *java
    image: bloom-identity:local
    build:
      context: .
      dockerfile: infrastructure/java/Dockerfile
      args:
        SERVICE: identity
    volumes:
      - ./server/identity/src/main/resources/application.yml:/app/config/application.yml:ro
    command:
      - --server.address=0.0.0.0
      - --spring.datasource.url=jdbc:postgresql://postgres:5432/bloom_identity
      - --spring.kafka.bootstrap-servers=kafka:9092
    ports:
      - '127.0.0.1:8081:8081'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 15

  users:
    <<: *java
    image: bloom-users:local
    build:
      context: .
      dockerfile: infrastructure/java/Dockerfile
      args:
        SERVICE: users
    volumes:
      - ./server/users/src/main/resources/application.yml:/app/config/application.yml:ro
    command:
      - --server.address=0.0.0.0
      - --spring.datasource.url=jdbc:postgresql://postgres:5432/bloom_users
      - --spring.kafka.bootstrap-servers=kafka:9092
      - --bloom.identity.url=http://identity:8081
      - --bloom.media.url=http://media:8093
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 15

  chat:
    image: bloom-chat:local
    build:
      context: ./server/chat
    environment:
      DATABASE_URL: postgres://bloom_chat:CHANGE_ME@postgres:5432/bloom_chat?sslmode=disable
      KAFKA_BROKER: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Existing Chat has no readiness endpoint; only check its listening socket.
      test: ["CMD", "nc", "-z", "127.0.0.1", "8091"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 15
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    networks: [backend]

  media:
    image: bloom-media:local
    build:
      context: ./server/media
    environment:
      DATABASE_URL: postgres://bloom_media:CHANGE_ME@postgres:5432/bloom_media?sslmode=disable
      HOST_URL: /api/v1
      KAFKA_BROKER: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - media-data:/app/uploads
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    networks: [backend]

  api-gateway:
    <<: *java
    image: bloom-api-gateway:local
    build:
      context: .
      dockerfile: infrastructure/java/Dockerfile
      args:
        SERVICE: api-gateway
    volumes:
      - ./server/api-gateway/src/main/resources/application.yml:/app/config/application.yml:ro
    command:
      - --server.address=0.0.0.0
      - --IDENTITY_URL=http://identity:8081
      - --USERS_URL=http://users:8082
      - --CHAT_URL=http://chat:8091
      - --CHAT_WS_URL=ws://chat:8091
      - --INTERACTIONS_URL=http://interactions:8083
      - --ACTIVITIES_URL=http://activities:8084
      - --DISCOVERY_URL=http://discovery:8092
      - --MEDIA_URL=http://media:8093
      - --NOTIFICATIONS_URL=http://notifications:8094
      - --bloom.api-docs.enabled=true
    depends_on:
      identity:
        condition: service_healthy
      users:
        condition: service_healthy
      chat:
        condition: service_healthy
    ports:
      - '8080:8080'
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 15

  interactions:
    <<: *java
    profiles: [stubs]
    image: bloom-interactions:local
    build:
      context: .
      dockerfile: infrastructure/java/Dockerfile
      args:
        SERVICE: interactions
    volumes:
      - ./server/interactions/src/main/resources/application.properties:/app/config/application.properties:ro
    command: [--server.address=0.0.0.0]

  activities:
    <<: *java
    profiles: [stubs]
    image: bloom-activities:local
    build:
      context: .
      dockerfile: infrastructure/java/Dockerfile
      args:
        SERVICE: activities
    volumes:
      - ./server/activities/src/main/resources/application.properties:/app/config/application.properties:ro
    command: [--server.address=0.0.0.0]

volumes:
  postgres-data:
  kafka-data:
  media-data:

networks:
  edge:
  backend:
    internal: true
